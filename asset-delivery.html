<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>@@TITLE@@</title>
<style>
:root{--ink:#152d34;--muted:#61716f;--line:#dce5e0;--paper:#f4f6f2;--accent:#126e60}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.75 "Microsoft YaHei","PingFang SC",sans-serif}a{color:var(--accent)}button,input,select{font:inherit}button,a.action{cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:9px 15px;background:white;color:var(--ink);text-decoration:none}button:hover{border-color:var(--accent)}:focus-visible{outline:3px solid #d88f46;outline-offset:3px}header{padding:52px max(24px,calc((100vw - 1160px)/2));background:#153b38;color:white}header .eyebrow{font-size:12px;letter-spacing:3px;color:#a5cec0}h1{font-size:clamp(28px,4vw,46px);font-weight:600;line-height:1.3;margin:14px 0 20px}header p{max-width:860px;color:#d1e1db}header a{display:inline-block;margin-top:14px}main{max-width:1208px;margin:auto;padding:28px 24px 70px}.intro{padding:25px 28px;background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:24px}.intro h2{margin:0 0 10px;font-size:20px}.toolbar{position:sticky;top:0;z-index:2;display:flex;gap:12px;flex-wrap:wrap;padding:16px 0;background:var(--paper)}input,select{border:1px solid #cbd9d1;border-radius:8px;background:white;padding:10px 13px;color:var(--ink)}input{flex:1;min-width:190px}.results{color:var(--muted);font-size:14px;margin:6px 0 18px}article{scroll-margin-top:110px;background:white;border:1px solid var(--line);border-radius:14px;padding:28px;margin-bottom:20px;overflow-wrap:anywhere}.cardhead{display:flex;justify-content:space-between;gap:18px;align-items:start}.meta{font-size:13px;color:var(--muted)}.cardhead h2{font-size:24px;margin:4px 0 8px;line-height:1.45}.tag{font-size:12px;color:var(--accent);letter-spacing:.8px}.label{font-weight:600;font-size:14px;margin:20px 0 8px}.design{margin:8px 0}.anchors{display:flex;flex-wrap:wrap;gap:8px}.anchor{background:#eaf2ed;color:#286653;border-radius:6px;padding:4px 10px;font-size:13px}pre{font:15px/1.9 "Microsoft YaHei","PingFang SC",sans-serif;white-space:pre-wrap;overflow-wrap:anywhere;padding:22px;background:#f2f5f1;border:1px solid #e2e8e1;border-radius:8px;margin:12px 0;user-select:text}details{border-top:1px solid var(--line);padding-top:14px;margin-top:18px}summary{cursor:pointer;color:var(--muted)}.notice{border-left:3px solid #bb985f;padding-left:16px;color:#685338}.preview{background:#121923;border-radius:9px;margin:12px 0;overflow:hidden}.preview.light{background:#eeeae1}.preview img{display:block;width:100%;height:auto}.media-controls{display:flex;gap:9px;flex-wrap:wrap}.empty{padding:40px;text-align:center;color:var(--muted)}footer{font-size:13px;color:var(--muted);padding-top:20px}@media(max-width:600px){header{padding:32px 20px}main{padding:20px 14px}article,.intro{padding:20px}.cardhead{display:block}.cardhead button{margin-top:10px}pre{padding:15px;font-size:14px}}@media print{.toolbar,.action,button{display:none}header{background:white;color:black}article{break-inside:auto}pre{white-space:pre-wrap}}
</style></head><body>
<header><div class="eyebrow">23 / ASSET FACTORY</div><h1 id="title"></h1><p id="scope"></p><p id="spec"></p><a class="action" href="@@PDF@@" download>下载完整PDF</a></header>
<main><section class="intro"><h2>美术方向</h2><p id="direction"></p><div id="issues"></div></section>
<div class="toolbar"><input id="search" type="search" aria-label="搜索资产" placeholder="搜索姓名、ID、集数或设计关键词"><select id="kind" aria-label="资产分类"><option value="">全部资产</option><option value="CHR">人物</option><option value="SCN">场景</option><option value="PRP">道具</option><option value="FX">特效</option><option value="UI">系统框</option></select></div>
<p class="results" id="count" aria-live="polite"></p><section id="cards"></section><footer>普通资产为设计提示词，未冒充已生成图片；动态素材以各项实际状态为准。</footer></main>
<script type="application/json" id="asset-data">@@DATA@@</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('asset-data').textContent), el=id=>document.getElementById(id);
const node=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
el('title').textContent=data.title;el('scope').textContent=data.scope+' · '+data.version;el('spec').textContent=data.model+' / '+data.spec;el('direction').textContent=data.art_direction;
if(data.issues?.length){el('issues').append(node('h3','待确认与未交付项'));for(const s of data.issues)el('issues').append(node('p',s,'notice'))}
async function copyPrompt(button,prompt){try{if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(prompt);else{const t=node('textarea',prompt);t.style.position='fixed';t.style.left='-9999px';document.body.append(t);t.select();const ok=document.execCommand('copy');t.remove();if(!ok)throw Error('copy')}button.textContent='已复制完整提示词'}catch{button.textContent='请选中下方提示词复制'}}
const all=[];
for(const a of data.assets){
 const card=node('article');card.id=a.id;const head=node('div',undefined,'cardhead'), info=node('div');info.append(node('div',a.kind+' / '+a.id+' · '+a.status,'tag'),node('h2',a.name),node('p',a.source,'meta'));const copy=node('button','复制提示词');copy.addEventListener('click',()=>copyPrompt(copy,a.prompt));head.append(info,copy);card.append(head,node('div','美术设定','label'),node('p',a.design,'design'));
 if(a.anchors?.length){const anchors=node('div',undefined,'anchors');for(const s of a.anchors)anchors.append(node('span',s,'anchor'));card.append(anchors)}
 card.append(node('div','完整提示词','label'),node('pre',a.prompt));
 if(a.text_layers?.length){card.append(node('div','准确文字层 · 后期另排','label'));for(const s of a.text_layers)card.append(node('pre',s))}
 if(a.notes?.length){const det=node('details');det.append(node('summary','制作说明'));for(const s of a.notes)det.append(node('p',s));card.append(det)}
 if(a.media){const m=a.media,box=node('div',undefined,'preview'),img=node('img');img.src=m.preview;img.alt=a.name+'动态预览';box.append(img);const controls=node('div',undefined,'media-controls'),pause=node('button','暂停'),bg=node('button','切换深浅底'),dl=node('a','下载动态素材','action');let playing=true;pause.onclick=()=>{playing=!playing;img.src=playing?m.preview:m.poster;pause.textContent=playing?'暂停':'播放'};bg.onclick=()=>box.classList.toggle('light');dl.href=m.download;dl.download='';controls.append(pause,bg,dl);card.append(node('div',m.spec,'label'),box,controls)}
 el('cards').append(card);all.push({card,a,text:JSON.stringify(a).toLocaleLowerCase()});
}
const empty=node('p','没有匹配资产，请调整搜索或分类。','empty');el('cards').append(empty);
function filter(){const q=el('search').value.trim().toLocaleLowerCase(),k=el('kind').value;let n=0;for(const x of all){const match=(!k||x.a.kind===k)&&(!q||x.text.includes(q));x.card.hidden=!match;if(match)n++}empty.hidden=n!==0;el('count').textContent=`显示 ${n} / ${all.length} 条资产设计`}
el('search').addEventListener('input',filter);el('kind').addEventListener('change',filter);filter();
if(location.hash){const target=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(target)target.scrollIntoView()}
</script></body></html>
